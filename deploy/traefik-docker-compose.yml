# ==============================================================================
# Traefik + DRK Warenbestand Compose Stack
# Für automatische Let's Encrypt Zertifikate oder reine HTTP-Terminierung
# ==============================================================================

version: '3.8'

services:
  traefik:
    image: traefik:v3.1
    container_name: traefik-drk
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # Optional: ACME / Let's Encrypt aktivieren sobald Domain vorhanden:
      # - "--certificatesresolvers.myresolver.acme.tlschallenge=true"
      # - "--certificatesresolvers.myresolver.acme.email=admin@drk-laupheim.de"
      # - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "traefik_certs:/letsencrypt"
    networks:
      - proxy_net

  drk-inventory:
    image: drk-warenbestand:latest
    container_name: drk-warenbestand
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      # HTTP Router für internes Netz / Tailscale
      - "traefik.http.routers.drk.rule=Host(`inventar.drk-laupheim.internal`) || Host(`drk-nas.tailscale.net`)"
      - "traefik.http.routers.drk.entrypoints=web"
      - "traefik.http.services.drk.loadbalancer.server.port=8080"
    volumes:
      - drk_inventory_data:/data
    networks:
      - proxy_net

volumes:
  traefik_certs:
  drk_inventory_data:

networks:
  proxy_net:
    external: false
