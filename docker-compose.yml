# ==============================================================================
# DRK Warenbestand & Medizinprodukte (OV Laupheim)
# Docker Compose Konfiguration für Synology NAS, Proxmox, VPS oder Mini-PC
# ==============================================================================

version: '3.8'

services:
  drk-inventory:
    container_name: drk-warenbestand-laupheim
    image: drk-warenbestand:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:8080" # Standard HTTP Port für Tailscale / lokales LAN
    environment:
      - NODE_ENV=production
      - PORT=8080
      - DRK_OV_NAME=DRK Ortsverein Laupheim e.V.
      - DRK_DEFAULT_TIMEZONE=Europe/Berlin
      - DATA_DIR=/data
    volumes:
      - drk_inventory_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
    # Falls Traefik oder Tailscale Netzwerk genutzt wird:
    networks:
      - drk_net

volumes:
  drk_inventory_data:
    name: drk_inventory_data_laupheim

networks:
  drk_net:
    driver: bridge
